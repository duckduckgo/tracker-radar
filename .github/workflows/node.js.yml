# This workflow will do a clean install of node dependencies, build the source code and run tests using the node version in .nvmrc

name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js from .nvmrc
      uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
    - run: npm ci
    - run: npm test
